<style>
/* efin.finance design tokens */
:root {
  --surface-0: #ffffff;
  --surface-1: #fbfbfb;
  --surface-2: #f7f7f7;
  --surface-3: #f7f8f8;
  --surface-tint-blue: #f5f9ff;
  --surface-tint-blue-2: #d6f2ff;
  --border-1: #e9ebf0;
  --border-2: #edeef1;
  --border-3: #d8dbdf;
  --border-4: #e8e8e8;
  --text-1: #25272c;
  --text-2: #5b616e;
  --text-3: #8e95a2;
  --text-4: #b6bac3;
  --text-5: #d8dbdf;
  --brand: #007dfe;
  --brand-soft: #d6f2ff;
  --brand-soft-2: #e8f3ff;
  --up: #40bc7c;
  --up-deep: #2d8b76;
  --up-soft: #e7f8ee;
  --down: #e64040;
  --down-soft: #fdecec;
  --down-light: #f87171;
  --shadow-card: 0 4px 20px 13px rgba(0,42,105,0.05);
  --shadow-card-2: 0 4px 20px 0 rgba(0,64,162,0.05);
  --shadow-pop: 0 8px 24px rgba(11,11,11,0.1);
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-pill: 999px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
  --font-th: "Noto Sans Thai","Sarabun",system-ui,-apple-system,sans-serif;
  --font-num: "Inter","Noto Sans Thai",system-ui,sans-serif;
  --tile-gap: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-th);
  color: var(--text-1);
  background: #eef0f4;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 1;
}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
.muted { color: var(--text-3); }
.dim { color: var(--text-2); }
.scroll-x { overflow-x: auto; }
.scroll-x::-webkit-scrollbar { height: 6px; }
.scroll-x::-webkit-scrollbar-thumb { background: var(--border-3); border-radius: 999px; }
.scroll-x::-webkit-scrollbar-track { background: transparent; }

/* Shell */
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,0.85);
  backdrop-filter: saturate(180%) blur(10px);
  border-bottom: 1px solid var(--border-1);
  padding: 10px 20px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.topbar .brand-mark {
  font-weight: 700; font-size: 16px; color: var(--text-1);
  letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px;
}
.topbar .brand-mark .dot {
  width: 10px; height: 10px; border-radius: 999px;
  background: linear-gradient(135deg, var(--brand), #5fa8ff);
}
.topbar .spacer { flex: 1; }

/* Segmented control */
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-pill); padding: 3px; gap: 2px; }
.seg button {
  appearance: none; border: 0; background: transparent; font: inherit;
  padding: 6px 12px; border-radius: var(--r-pill); color: var(--text-2); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap;
}
.seg button.active { background: var(--surface-0); color: var(--text-1); box-shadow: 0 1px 2px rgba(0,0,0,0.06); font-weight: 600; }

/* Btn */
.btn {
  appearance: none; border: 1px solid var(--border-1); background: var(--surface-0);
  font: inherit; padding: 6px 12px; border-radius: 8px; color: var(--text-1); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.primary:hover { filter: brightness(0.95); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }

/* Viewport frame */
.viewport-frame { margin: 20px auto; max-width: 100%; transition: max-width 220ms ease; background: transparent; }
.viewport-frame.mobile  { max-width: 390px; }
.viewport-frame.tablet  { max-width: 768px; }
.viewport-frame.laptop  { max-width: 1180px; }
.viewport-frame.desktop { max-width: 1400px; }

/* Dashboard grid */
.grid { display: grid; gap: var(--tile-gap); padding: 16px; grid-auto-rows: 120px; }
.viewport-frame.desktop .grid { grid-template-columns: repeat(4, 1fr); }
.viewport-frame.laptop  .grid { grid-template-columns: repeat(4, 1fr); }
.viewport-frame.tablet  .grid { grid-template-columns: repeat(2, 1fr); }
.viewport-frame.mobile  .grid { grid-template-columns: repeat(1, 1fr); grid-auto-rows: 120px; }

/* Cell */
.cell {
  position: relative; background: var(--surface-0); border-radius: var(--r-lg);
  box-shadow: var(--shadow-card); display: flex; flex-direction: column;
  min-width: 0; overflow: hidden;
}
.cell.editing { outline: 2px dashed var(--brand); outline-offset: -1px; }
.cell.dragging { opacity: 0.55; }

/* Widget header */
.w-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; flex: 0 0 auto; }
.w-head .title { font-size: 14px; font-weight: 600; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-head .meta { margin-left: auto; font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.w-head .meta select, .w-head .pill {
  appearance: none; font: inherit; padding: 4px 10px; border-radius: var(--r-pill);
  background: var(--surface-2); border: 0; font-size: 12px; color: var(--text-2); cursor: pointer;
}
.w-body { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; padding: 0 16px 14px; gap: 8px; }

/* Resize handle */
.resize-handle {
  position: absolute; right: 4px; bottom: 4px; width: 18px; height: 18px;
  border-radius: 4px; cursor: nwse-resize; opacity: 0; transition: opacity 120ms;
  display: grid; place-items: center; color: var(--text-3);
}
.cell:hover .resize-handle, .editing .resize-handle { opacity: 1; }
.resize-handle::after {
  content: ""; width: 12px; height: 12px;
  background: linear-gradient(135deg, transparent 60%, var(--text-3) 60% 65%, transparent 65% 75%, var(--text-3) 75% 80%, transparent 80% 90%, var(--text-3) 90% 95%, transparent 95%);
}

/* Drag handle */
.drag-handle {
  position: absolute; top: 6px; left: 6px; width: 24px; height: 24px;
  display: grid; place-items: center; color: var(--text-4); cursor: grab;
  opacity: 0; transition: opacity 120ms; border-radius: 6px;
}
.cell:hover .drag-handle, .editing .drag-handle { opacity: 1; }
.drag-handle:hover { background: var(--surface-2); color: var(--text-2); }
.drag-handle:active { cursor: grabbing; }

/* Table */
table.t { width: 100%; border-collapse: collapse; font-size: 12px; color: var(--text-1); }
table.t thead th {
  text-align: right; font-weight: 400; color: var(--text-3);
  padding: 8px 10px; border-bottom: 1px solid var(--border-1);
  white-space: nowrap; background: var(--surface-0); position: sticky; top: 0;
}
table.t thead th:first-child, table.t tbody td:first-child { text-align: left; }
table.t tbody td { padding: 7px 10px; border-bottom: 1px solid var(--border-2); text-align: right; white-space: nowrap; }
table.t tbody tr:last-child td { border-bottom: 0; }
table.t.zebra tbody tr:nth-child(2n) { background: rgba(247,248,248,0.6); }
table.t.compact thead th, table.t.compact tbody td { padding: 5px 8px; font-size: 11px; }
table.t .sym { font-weight: 600; color: var(--text-1); }

/* Table container */
.t-wrap { border: 1px solid var(--border-1); border-radius: var(--r-md); overflow: hidden; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.t-scroll { overflow: auto; flex: 1; min-height: 0; }
.t-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
.t-scroll::-webkit-scrollbar-thumb { background: var(--border-3); border-radius: 999px; }

/* Stat block */
.stat-num { font-family: var(--font-num); font-weight: 700; letter-spacing: -0.02em; font-feature-settings: "tnum" 1; }
.kpi-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.kpi-pill.up { background: var(--up-soft); color: var(--up-deep); }
.kpi-pill.down { background: var(--down-soft); color: var(--down); }

/* Mini grid for Market Info */
.mi-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 12px; }
.mi-stats > div { display: flex; justify-content: space-between; gap: 8px; }
.mi-stats .lbl { color: var(--text-3); }
.mi-stats .val { font-family: var(--font-num); color: var(--text-1); font-weight: 500; }

/* Movement bar */
.move { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 4px; }
.move .b { border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; align-items: flex-start; font-size: 11px; }
.move .b strong { font-family: var(--font-num); font-size: 14px; font-weight: 700; }
.move .b small { color: var(--text-3); }
.move .b.u { background: var(--up-soft); color: var(--up-deep); }
.move .b.d { background: var(--down-soft); color: var(--down); }
.move .b.n { background: var(--surface-2); color: var(--text-2); }
.move .b.u strong { color: var(--up); }
.move .b.d strong { color: var(--down); }
.move .b.n strong { color: var(--text-1); }

/* Tabs */
.tabs { display: inline-flex; background: var(--surface-2); border-radius: var(--r-pill); padding: 2px; font-size: 12px; }
.tabs button { appearance: none; border: 0; background: transparent; padding: 4px 10px; border-radius: var(--r-pill); cursor: pointer; color: var(--text-2); font: inherit; }
.tabs button.active { background: var(--surface-0); color: var(--text-1); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

/* Chart */
.chart-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.legend .chip { padding: 2px 10px; border-radius: 999px; font-size: 11px; color: #fff; display: inline-flex; align-items: center; gap: 6px; }

/* Size-aware density */
.cell[data-cw="1"] .w-head .meta .label-th { display: none; }
.cell[data-cw="1"] .w-body { padding: 0 12px 12px; }
.cell[data-cw="1"] .w-head { padding: 12px 12px 4px; }

/* Edit grid bg */
.grid.editing-bg { background: linear-gradient(0deg, rgba(0,125,254,0.04), rgba(0,125,254,0.04)); border-radius: 12px; }

/* Hover tooltip */
.row-pop { position: absolute; background: #1a2230; color: #fff; font-size: 11px; padding: 8px 10px; border-radius: 6px; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow-pop); }

/* Size badge */
.size-badge {
  position: absolute; top: 8px; right: 8px;
  background: rgba(0,125,254,0.92); color: #fff;
  font-family: var(--font-num); font-size: 10px; padding: 2px 6px;
  border-radius: 999px; letter-spacing: 0.04em; pointer-events: none;
  opacity: 0; transition: opacity 120ms;
}
.cell.editing .size-badge { opacity: 1; }

@media (max-width: 640px) {
  .w-head { padding: 12px 12px 4px; }
  .w-body { padding: 0 12px 12px; }
  table.t thead th, table.t tbody td { padding: 6px 8px; font-size: 11px; }
}
</style>

(function buildSeries() {
  const ff = window.EFIN_DATA.fundFlowChart;
  const N = ff.days;
  const seeds = [
    { amp: 1.0, base:  20000, freq: 0.32, phase: 0.0 },
    { amp: 1.4, base:  60000, freq: 0.21, phase: 0.6 },
    { amp: 1.2, base: -40000, freq: 0.28, phase: 1.4 },
    { amp: 0.9, base: -10000, freq: 0.45, phase: 2.1 },
  ];
  ff.series.forEach((s, i) => {
    const seed = seeds[i % seeds.length];
    const values = [];
    for (let k = 0; k < N; k++) {
      const t = k / (N - 1);
      const v = seed.base +
        Math.sin(seed.phase + t * Math.PI * 4 * seed.freq) * 80000 * seed.amp +
        Math.sin(seed.phase * 2 + t * Math.PI * 7) * 25000 * seed.amp;
      values.push(v);
    }
    s.values = values;
  });
})();

}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = useState(false);
  const dragRef = useRef(null);
  const offsetRef = useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) {
    return (

// ── Fund Flow Chart Widget ────────────────────────────────────────────────────
function FundFlowChartWidget({ cw, ch }) {
  const D = window.EFIN_DATA.fundFlowChart;
  const [hover, setHover] = useState(null);
  const [enabled, setEnabled] = useState(D.series.map(() => true));
  const containerRef = useRef(null);
  const [dims, setDims] = useState({ w: 400, h: 200 });

  useEffect(() => {
    if (!containerRef.current) return;
    const ro = new ResizeObserver(([entry]) => {
      const r = entry.contentRect;
      setDims({ w: Math.max(100, r.width), h: Math.max(80, r.height) });
    });
    ro.observe(containerRef.current);
    return () => ro.disconnect();
  }, []);

  const pad = { t: 8, r: 8, b: 18, l: 44 };
  const W = dims.w, H = dims.h;
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const activeSeries = D.series.filter((_, i) => enabled[i]);
  const all = activeSeries.flatMap(s => s.values);
  const minV = activeSeries.length ? Math.min(...all) : -100000;
  const maxV = activeSeries.length ? Math.max(...all) : 100000;
  const span = maxV - minV || 1;
  const N = D.days;
  const xAt = i => pad.l + (i / (N - 1)) * innerW;
  const yAt = v => pad.t + (1 - (v - minV) / span) * innerH;
  const ticks = Array.from({ length: 5 }, (_, i) => minV + (span * i) / 4);

  const onMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - rect.left;
    let i = Math.round(((x - pad.l) / innerW) * (N - 1));
    i = Math.max(0, Math.min(N - 1, i));
    setHover({ i, mx: x });
  };

  return (
    <React.Fragment>
      <div className="w-head">
        <div className="title">สรุปมูลค่าการซื้อขายสิ้นวัน</div>
        <span className="meta">
          <span className="muted" style={{fontSize:11}}>ข้อมูล ณ</span>
          <span className="pill">4 ก.ค. 2569</span>
        </span>
      </div>
      <div className="w-body">
        <div ref={containerRef} className="chart-wrap" style={{position:"relative"}} onMouseLeave={() => setHover(null)}>
          <svg width={W} height={H} onMouseMove={onMove} style={{display:"block"}}>
            {ticks.map((v, i) => (
              <g key={i}>
                <line x1={pad.l} x2={W - pad.r} y1={yAt(v)} y2={yAt(v)} stroke="var(--border-1)" strokeDasharray="2 4"/>
                <text x={pad.l - 6} y={yAt(v)+3} fontSize="10" textAnchor="end" fill="var(--text-3)" fontFamily="Inter">
                  {Math.round(v/1000)}K
                </text>
              </g>
            ))}
            {[0, Math.floor(N/3), Math.floor(2*N/3), N-1].map(i => (
              <text key={i} x={xAt(i)} y={H-4} fontSize="10" textAnchor="middle" fill="var(--text-3)" fontFamily="Inter">
                {`${i+1} มิ.ย.`}
              </text>
            ))}
            {D.series.map((s, si) => {
              if (!enabled[si]) return null;
              const d = s.values.map((v, i) => `${i === 0 ? "M" : "L"} ${xAt(i).toFixed(1)} ${yAt(v).toFixed(1)}`).join(" ");
              return <path key={si} d={d} fill="none" stroke={s.color} strokeWidth="1.6"/>;
            })}
            {hover && (
              <g>
                <line x1={xAt(hover.i)} x2={xAt(hover.i)} y1={pad.t} y2={H - pad.b} stroke="var(--text-1)" strokeOpacity="0.3"/>
                {D.series.map((s, si) => !enabled[si] ? null :
                  <circle key={si} cx={xAt(hover.i)} cy={yAt(s.values[hover.i])} r="3" fill={s.color} stroke="#fff" strokeWidth="1.5"/>
                )}
              </g>
            )}
          </svg>
          {hover && (
            <div className="row-pop" style={{ left: Math.min(W - 180, xAt(hover.i) + 8), top: 8 }}>
              <div style={{opacity:0.7, marginBottom:4}}>{hover.i+1} มิ.ย. 2569</div>
              {D.series.map((s, si) => enabled[si] && (
                <div key={si} style={{display:"flex", justifyContent:"space-between", gap:14}}>
                  <span style={{color: s.color}}>● {s.name}</span>
                  <span className="num">{Math.round(s.values[hover.i]/1000)}K</span>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="legend">
          {D.series.map((s, si) => (
            <button key={si} onClick={() => setEnabled(e => e.map((v, i) => i === si ? !v : v))}
              className="chip" style={{ background: enabled[si] ? s.color : "var(--surface-2)", color: enabled[si] ? "#fff" : "var(--text-3)", border: "0", cursor: "pointer" }}>
              {s.name}
            </button>
          ))}
        </div>
      </div>
    </React.Fragment>
  );
}

// ── Dashboard Cell ────────────────────────────────────────────────────────────
function WidgetCell({ widget, idx, edit, onChange, breakpoint, dragSrc, setDragSrc, onMove }) {
  const ref = useRef(null);
  const [resizing, setResizing] = useState(null);
  const [drag, setDrag] = useState(false);

  const cw = resizing ? resizing.w : widget.w;
  const ch = resizing ? resizing.h : widget.h;
  const maxCols = breakpoint === "mobile" ? 1 : breakpoint === "tablet" ? 2 : 4;
  const effW = Math.min(cw, maxCols);

  const startResize = useCallback((e) => {
    e.preventDefault();
    e.stopPropagation();
    if (!ref.current) return;
    const startX = e.clientX, startY = e.clientY;
    const rect = ref.current.getBoundingClientRect();
    const parent = ref.current.parentElement;
    const parentRect = parent.getBoundingClientRect();
    const gridStyle = getComputedStyle(parent);
    const cols = gridStyle.gridTemplateColumns.split(" ").length || 4;
    const gap = parseFloat(getComputedStyle(parent).gap) || 16;
    const tileW = (parentRect.width - (cols - 1) * gap - 32) / cols;
    const tileH = parseFloat(gridStyle.gridAutoRows) || 120;
    const def = widget.def;

    const onMouseMove = (ev) => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      let nw = Math.round((rect.width + dx) / (tileW + gap));
      let nh = Math.round((rect.height + dy) / (tileH + gap));
      nw = Math.max(def.min[0], Math.min(def.max[0], nw, maxCols));
      nh = Math.max(def.min[1], Math.min(def.max[1], nh));
      setResizing({ w: nw, h: nh });
    };
    const onMouseUp = () => {
      window.removeEventListener("mousemove", onMouseMove);
      window.removeEventListener("mouseup", onMouseUp);
      setResizing(r => { if (r) onChange({ ...widget, w: r.w, h: r.h }); return null; });
    };
    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("mouseup", onMouseUp);
  }, [widget, maxCols, onChange]);

  const handleDragStart = (e) => {
    if (!edit) return;
    setDragSrc(idx); setDrag(true);
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", String(idx)); } catch {}
  };
  const handleDragOver = (e) => { if (edit && dragSrc != null && dragSrc !== idx) e.preventDefault(); };
  const handleDrop = (e) => {
    if (edit && dragSrc != null && dragSrc !== idx) { e.preventDefault(); onMove(dragSrc, idx); }
    setDragSrc(null); setDrag(false);
  };
  const handleDragEnd = () => { setDragSrc(null); setDrag(false); };

  const C = WIDGET_REGISTRY[widget.def.type];

  return (
    <div ref={ref}
         className={`cell ${edit ? "editing" : ""} ${drag ? "dragging" : ""}`}
         data-cw={effW} data-ch={ch}
         style={{ gridColumn: `span ${effW}`, gridRow: `span ${ch}` }}
         draggable={edit}
         onDragStart={handleDragStart}
         onDragOver={handleDragOver}
         onDrop={handleDrop}
         onDragEnd={handleDragEnd}>
      {C && <C cw={effW} ch={ch} {...(widget.props || {})} />}
      {edit && (
        <React.Fragment>
          <div className="drag-handle" title="Drag to reorder"><DragGrip /></div>
          <div className="size-badge">{effW}×{ch}</div>
          <div className="resize-handle" onMouseDown={startResize} title="Drag to resize" />
        </React.Fragment>
      )}
    </div>
  );
}

    r.setProperty("--down", t.down);

    try { localStorage.setItem("efin-widgets-layout-v2", JSON.stringify(layout)); } catch {}
  }, [layout]);

  const updateAt = (i, w) => setLayout(L => L.map((x, k) => k === i ? w : x));

    const a = [...L]; const [it] = a.splice(from, 1); a.splice(to, 0, it); return a;

        <TweakSection label="Colors">
          <TweakColor label="Brand"   value={t.brand}   onChange={v => setT("brand", v)}   options={["#007dfe","#0b5cad","#7c3aed","#e11d48","#0ea5e9"]} />
          <TweakColor label="Up"      value={t.up}      onChange={v => setT("up", v)}      options={["#40bc7c","#16a34a","#2dd4bf"]} />
          <TweakColor label="Down"    value={t.down}    onChange={v => setT("down", v)}    options={["#e64040","#dc2626","#f97316"]} />
          <TweakColor label="Page bg" value={t.page}    onChange={v => setT("page", v)}    options={["#eef0f4","#f5f7fb","#0f172a","#ffffff"]} />
          <TweakColor label="Card bg" value={t.surface} onChange={v => setT("surface", v)} options={["#ffffff","#fbfbfb","#1a2230"]} />
        </TweakSection>
        <TweakSection label="Type &amp; layout">
          <TweakSelect label="Font" value={t.fontFamily} onChange={v => setT("fontFamily", v)}
            options={[
              {value:"Noto Sans Thai",    label:"Noto Sans Thai"},
              {value:"Sarabun",           label:"Sarabun"},
              {value:"Inter",             label:"Inter"},
              {value:"IBM Plex Sans Thai",label:"IBM Plex Sans Thai"},
            ]} />
          <TweakSlider label="Tile gap"    value={t.tileGap} unit="px" min={4}  max={32}  step={2}  onChange={v => setT("tileGap", v)} />
          <TweakSlider label="Row height"  value={t.tileRow} unit="px" min={80} max={180} step={10} onChange={v => setT("tileRow", v)} />
          <TweakSlider label="Card radius" value={t.radius}  unit="px" min={0}  max={24}  step={1}  onChange={v => setT("radius", v)} />
        </TweakSection>
        <TweakSection label="Layout">
          <TweakButton label="Reset to default" onClick={reset} />
          <TweakButton label={edit ? "Exit edit mode" : "Enter edit mode"} onClick={() => setEdit(e => !e)} secondary />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

function BpIcon({ kind }) {
  const sw = "1.6";
  if (kind === "mobile")  return <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw}><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>;
  if (kind === "tablet")  return <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw}><rect x="4" y="3" width="16" height="18" rx="2"/></svg>;
  if (kind === "laptop")  return <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw}><rect x="3" y="5" width="18" height="11" rx="1.5"/><path d="M2 19h20"/></svg>;
  return <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw}><rect x="2" y="4" width="20" height="13" rx="1.5"/><path d="M9 21h6M12 17v4"/></svg>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
